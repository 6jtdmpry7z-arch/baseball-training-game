<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101d2c"><title>BASEBALL LIFE — Ver.0.1</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;color:#e9f2fc;background:#0b1420}*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#122438,#0b1420 45%);min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.38;cursor:not-allowed}.wrap{max-width:650px;margin:auto;padding:18px 15px 100px}.hero{padding:18px 2px}.eyebrow{color:#68d6b4;font-weight:800;font-size:11px;letter-spacing:3px}.hero h1{margin:4px 0 0;font-size:29px;letter-spacing:1px}.sub{color:#91a9c1;font-size:12px;margin-top:5px}.card{background:#182a3d;border:1px solid #2c4259;border-radius:18px;padding:17px;margin-bottom:13px;box-shadow:0 10px 30px #0002}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.title{font-size:16px;font-weight:800;margin:0 0 12px}.muted{color:#9cb0c5;font-size:12px}.big{font-size:25px;font-weight:900}.chip{font-size:11px;background:#263d54;border:1px solid #36516b;border-radius:99px;padding:5px 9px;color:#c6e5fb}.accent{color:#7be1bd}.btn{border:0;border-radius:12px;padding:12px 15px;font-weight:800;background:#6bdab2;color:#08271e}.btn.alt{background:#29415a;color:#e5f1ff}.btn.warn{background:#503b40;color:#ffd1d1}.btn:active{transform:scale(.98)}.full{width:100%}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.stat{background:#102033;border:1px solid #2c4057;border-radius:12px;padding:11px}.statname{font-size:11px;color:#9db5ca}.statval{font-size:21px;font-weight:900;margin-top:3px}.meter{height:8px;background:#0c1725;border-radius:30px;overflow:hidden;margin-top:7px}.fill{height:100%;background:#70d9b5;border-radius:30px}.fill.mood{background:#ffbf70}.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}.field label{font-size:12px;color:#c3d4e6;font-weight:700}.field input,.field select{width:100%;background:#0e1c2d;border:1px solid #39536d;color:#f2f7fc;border-radius:10px;padding:12px}.action{display:flex;align-items:center;justify-content:space-between;text-align:left;width:100%;border:1px solid #344c65;border-radius:12px;padding:12px;background:#102238;color:#f0f7ff;margin-bottom:8px}.action small{display:block;color:#a5bbcf;margin-top:4px;font-size:11px}.action strong{font-size:13px}.action .arrow{color:#7bdcb9;font-weight:900}.tabs{display:flex;gap:6px;overflow-x:auto;margin:0 0 13px}.tab{border:1px solid #32485e;border-radius:10px;padding:10px 12px;background:#15283b;color:#b3c6d9;white-space:nowrap;font-size:12px;font-weight:700}.tab.on{background:#69d9b2;color:#09291f;border-color:#69d9b2}.log{border-left:2px solid #365a71;padding:4px 0 9px 12px;margin:0 0 8px;font-size:12px;line-height:1.7}.overlay{position:fixed;inset:0;background:#030a12d9;display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}.modal{background:#1a2d42;border:1px solid #466079;border-radius:18px;padding:20px;max-width:480px;width:100%;max-height:86vh;overflow:auto}.modal h2{font-size:20px;margin:0 0 12px}.pitchgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.pitchbtn{padding:11px 6px;border-radius:9px;background:#102238;color:#f1f7ff;border:1px solid #3b5670;font-size:12px}.pitchbtn:disabled{opacity:.3}.empty{padding:22px;text-align:center;color:#a7bace}.footer{font-size:11px;color:#7993ab;text-align:center;padding:10px}.pill{font-size:11px;color:#7bdfb9}.hide{display:none!important}#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#d7ffed;color:#143b2b;padding:12px 16px;border-radius:12px;z-index:20;box-shadow:0 5px 30px #0009;font-size:13px;font-weight:700;display:none;max-width:90vw}ul{padding-left:20px;font-size:13px;line-height:1.9} .danger{color:#ffb3ae} .notice{background:#263d51;padding:10px;border-radius:10px;font-size:12px;line-height:1.7;margin:8px 0} .split{display:flex;gap:8px;flex-wrap:wrap} .tiny{font-size:10px;color:#829ab1}
</style></head><body><div class="wrap"><header class="hero"><div class="eyebrow">BASEBALL LIFE SIMULATOR</div><h1>⚾ BASEBALL LIFE</h1><div class="sub">人生を選べ。才能を育てろ。プロ野球選手を目指せ。 <span class="chip">Ver.0.1 試作版</span></div></header><div id="app"></div><div class="footer">端末内に自動保存 / オフライン動作対応 / 試作版のため試合・学校生活は未実装</div></div><div id="modal" class="overlay hide"><div class="modal" id="modalBody"></div></div><div id="toast"></div><script>
'use strict';
const KEY='baseball-life-v01-save';
const STATS=['ミート','パワー','走力','スタミナ','守備力','肩力','球速','コントロール','変化球総合','野球センス','学力'];
const PITCHES=['スライダー','縦スライダー','高速スライダー','スイーパー','スラーブ','カットボール','カーブ','スローカーブ','ドロップカーブ','ナックルカーブ','パワーカーブ','フォーク','スプリット（SFF）','高速フォーク','チェンジアップ','サークルチェンジ','パーム','ナックル','シュート','高速シュート','シンカー','高速シンカー','スクリュー','ツーシーム','ワンシーム','ジャイロボール','イーファスピッチ','スクリューボール','バルカンチェンジ','フォッシュボール'];
const ACTIONS=[['素振り',3,['ミート']],['筋力トレーニング',3,['パワー']],['ダッシュ',3,['走力']],['長距離走',3,['スタミナ']],['ノック',3,['守備力']],['キャッチボール',3,['肩力']],['投球練習',6,['球速','コントロール']],['変化球練習',6,['変化球総合','コントロール']],['野球研究',3,['野球センス','学力']],['練習をしたフリ',3,[]]];
const TALENTS=[['身体能力','身体練習の成長1.5倍'],['打撃技術','ミート・パワーの成長2倍'],['投球技術','球速・コントロールの成長2倍'],['守備技術','守備力・肩力の成長2倍'],['選球眼','ミート・野球センスの成長2倍'],['変化球技術','変化球総合・コントロールの成長2倍'],['練習吸収力','全練習の成長1.5倍'],['成長持続力','ケガ時の成長低下を軽減（今後拡張）'],['柔軟性','ケガ確率を半減'],['集中力','やる気が高い時、確率で成長2倍'],['観察力','野球研究時、確率で成長2倍'],['交渉力','野球センスの成長2倍'],['記憶力','今後の学習イベントで効果'],['分析力','野球研究時、確率で成長2倍'],['判断力','今後の試合イベントで効果'],['瞬発力','走力の成長1.5倍'],['筋力','パワーの成長1.5倍'],['持久力','スタミナの成長1.5倍'],['協調性','今後のチーム練習で効果'],['統率力','今後のチームイベントで効果'],['社交性','今後の友達イベントで効果'],['共感力','今後の恋愛イベントで効果'],['適応力','今後の入学イベントで効果'],['技術応用力','今後の特殊練習で効果'],['自己修正力','今後のケガ回復イベントで効果'],['勝負強さ','今後の試合イベントで効果'],['冷静','冬季練習の成長2倍'],['精神的回復力','今後の敗戦イベントで効果'],['プレッシャー耐性','今後の試合イベントで効果']];
let state=null,tab='home',pending=null;
const rand=(n)=>Math.floor(Math.random()*n), clamp=(v,a,b)=>Math.min(b,Math.max(a,v)),fmt=n=>Math.floor(n),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function age(){return state?Math.floor(state.week/48):0}function month(){return Math.floor(state.week%48/4)+1}function wk(){return state.week%4+1}function dateLabel(){return `${age()}歳 / ${month()}月 第${wk()}週`}
function save(){if(state)localStorage.setItem(KEY,JSON.stringify(state))}function load(){try{let d=JSON.parse(localStorage.getItem(KEY));if(d&&d.version===1&&d.stats&&Array.isArray(d.pitches)){state=d;return true}}catch(e){}return false}
function notice(s){let t=document.getElementById('toast');t.textContent=s;t.style.display='block';clearTimeout(notice.timer);notice.timer=setTimeout(()=>t.style.display='none',2400)}
function modal(html){document.getElementById('modalBody').innerHTML=html;document.getElementById('modal').classList.remove('hide')}
function closeModal(){if(pending)return;document.getElementById('modal').classList.add('hide')}
function addLog(s){state.logs.unshift({week:state.week,text:s});state.logs=state.logs.slice(0,100)}
function pickTalents(){let count=[0,1,2,3,4,5][(()=>{let x=Math.random()*100;return x<5?0:x<20?1:x<50?2:x<75?3:x<95?4:5})()];let techN=Math.random()<.05?2:Math.random()<.2666667?1:0;techN=Math.min(techN,count);let ids=[];while(ids.length<techN){let k=1+rand(5);if(!ids.includes(k))ids.push(k)}let pool=TALENTS.map((_,i)=>i).filter(i=>i!==0&&i>5);if(count>ids.length&&Math.random()<.15){ids.push(0)}while(ids.length<count){let k=pool[rand(pool.length)];if(!ids.includes(k))ids.push(k)}return ids}
function startGame(){let first=document.getElementById('first').value.trim(),last=document.getElementById('last').value.trim(),sex=document.getElementById('sex').value,place=document.getElementById('place').value;if(!first||!last){notice('姓と名を入力してね');return}let stats={};STATS.forEach(x=>stats[x]=0);state={version:1,name:last+' '+first,sex,place,week:0,stamina:100,motivation:100,stats,pitches:[],talents:pickTalents(),injury:0,injuryName:'',logs:[],finished:false,created:Date.now()};addLog('誕生！ 野球人生が始まった。');save();tab='home';render()}
function newScreen(){return `<section class="card"><h2 class="title">🌱 新しい野球人生を始める</h2><div class="field"><label>姓</label><input id="last" maxlength="20" placeholder="例：山田"></div><div class="field"><label>名</label><input id="first" maxlength="20" placeholder="例：太郎"></div><div class="field"><label>性別</label><select id="sex"><option>男性</option><option>女性</option><option>その他</option></select></div><div class="field"><label>出身地</label><select id="place">${['北海道','青森','岩手','宮城','秋田','山形','福島','茨城','栃木','群馬','埼玉','千葉','東京','神奈川','新潟','富山','石川','福井','山梨','長野','岐阜','静岡','愛知','三重','滋賀','京都','大阪','兵庫','奈良','和歌山','鳥取','島根','岡山','広島','山口','徳島','香川','愛媛','高知','福岡','佐賀','長崎','熊本','大分','宮崎','鹿児島','沖縄'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="notice">誕生日は4月2日固定。1年＝48週。出生時の才能はランダムに決まります。最初の3年間は「週を進める」で成長します。</div><button class="btn full" onclick="startGame()">人生をスタート ⚾</button></section>`}
function bar(name,value,color){return `<div style="margin-top:10px"><div class="row"><span class="muted">${name}</span><b>${fmt(value)}%</b></div><div class="meter"><div class="fill ${color||''}" style="width:${clamp(value,0,100)}%"></div></div></div>`}
function header(){return `<section class="card"><div class="row"><div><div class="muted">${esc(state.place)}出身 / ${esc(state.sex)}</div><div class="big">${esc(state.name)}</div><div class="muted">${dateLabel()}</div></div><span class="chip">${state.finished?'18歳終了':state.injury?'🤕 ケガ中':'⚾ 育成中'}</span></div>${bar('体力',state.stamina)}${bar('やる気',state.motivation,'mood')}${state.injury?`<div class="notice danger">🤕 ${esc(state.injuryName)}：回復まで残り${state.injury}週。練習不可。</div>`:''}</section>`}
function nav(){return `<nav class="tabs">${[['home','ホーム'],['train','練習'],['stats','能力'],['pitch','変化球'],['talent','才能'],['history','履歴']].map(([k,v])=>`<button class="tab ${tab===k?'on':''}" onclick="tab='${k}';render()">${v}</button>`).join('')}</nav>`}
function home(){return `<section class="card"><h2 class="title">🏟️ 今週の行動</h2>${age()<3?`<div class="notice">まだ${age()}歳。3歳から練習を始められるよ。</div>`:state.injury?`<div class="notice">ケガの治療中。休養または勉強を選ぼう。</div>`:`<button class="btn full" onclick="tab='train';render()">練習メニューを開く →</button>`}<div style="height:9px"></div><div class="grid"><button class="btn alt" ${state.finished?'disabled':''} onclick="rest()">🛌 休養<br><span class="tiny">体力+50 / やる気+20</span></button><button class="btn alt" ${state.finished?'disabled':''} onclick="study()">📚 勉強<br><span class="tiny">学力+1 / 野球センス+1</span></button></div><div style="height:9px"></div><button class="btn alt full" ${state.finished?'disabled':''} onclick="skip()">⏭️ 今週は何もしないで進む</button>${age()<3?'<div style="height:9px"></div><button class="btn full" onclick="fastForward()">🚀 3歳まで時間を進める</button>':''}</section><section class="card"><h2 class="title">📣 最新の出来事</h2>${state.logs.slice(0,4).map(x=>`<div class="log"><div class="tiny">${Math.floor(x.week/48)}歳・${Math.floor(x.week%48/4)+1}月</div>${esc(x.text)}</div>`).join('')}</section><section class="card"><h2 class="title">⚙️ データ管理</h2><div class="split"><button class="btn alt" onclick="exportSave()">セーブデータを書き出す</button><button class="btn warn" onclick="resetGame()">最初からやり直す</button></div><div class="tiny" style="margin-top:8px">プレイ状況はブラウザ内に自動保存。ブラウザデータを消すと失われる場合があります。</div></section>`}
function train(){return `<section class="card"><h2 class="title">💪 練習メニュー（全10種類）</h2><div class="muted" style="margin-bottom:12px">通常練習：体力−10、やる気−5。ケガ判定あり。</div>${ACTIONS.map((a,i)=>`<button class="action" ${state.finished||state.injury||age()<a[1]?'disabled':''} onclick="train(${i})"><div><strong>${i+1}. ${a[0]}</strong><small>${i===9?'能力成長なし / 体力+10 / やる気+5 / ケガなし':a[2].map(x=>x+'+1').join('・')} / ${a[1]}〜18歳</small></div><span class="arrow">›</span></button>`).join('')}${age()<3?'<div class="notice">3歳になると基本練習が解放されるよ。</div>':''}</section>`}
function stats(){return `<section class="card"><h2 class="title">📊 能力一覧</h2><div class="grid">${STATS.map(s=>`<div class="stat"><div class="statname">${s}</div><div class="statval">${fmt(state.stats[s])}<span class="tiny"> / 1000</span></div><div class="meter"><div class="fill" style="width:${state.stats[s]/10}%"></div></div></div>`).join('')}</div><div class="notice">成長値は内部で小数を保持し、画面では整数表示。能力上限は1000。</div></section>`}
function pitches(){return `<section class="card"><h2 class="title">🌀 習得済み変化球</h2><div class="row" style="margin-bottom:12px"><span class="muted">習得数</span><b>${state.pitches.length} / 7 球種</b></div>${state.pitches.length?state.pitches.map(p=>`<div class="stat" style="margin-bottom:8px"><div class="row"><strong>${esc(p.name)}</strong><span class="pill">変化量 ${p.move} / 7</span></div><div class="meter"><div class="fill" style="width:${p.move/7*100}%"></div></div></div>`).join(''):'<div class="empty">まだ変化球を覚えていないよ。<br>変化球総合100で最初の球種を習得！</div>'}<div class="notice">変化球総合が100・200・300・400・500・600・700に到達するたび、新球種を1つ選択。変化球練習時、対象球種があれば5％で変化量＋1。</div></section>`}
function talent(){return `<section class="card"><h2 class="title">✨ 生まれ持った才能</h2>${state.talents.length?state.talents.map(i=>`<div class="stat" style="margin-bottom:8px"><b>${esc(TALENTS[i][0])}</b><div class="muted">${esc(TALENTS[i][1])}</div></div>`).join(''):'<div class="empty">生得才能なし。努力で道を切り開こう！</div>'}<div class="notice">試作版では才能の一部のみ練習倍率に反映。覚醒条件・対人系・試合系などの詳細な才能イベントは今後実装する予定です。</div></section>`}
function history(){return `<section class="card"><h2 class="title">📖 成長履歴</h2>${state.logs.map(x=>`<div class="log"><div class="tiny">${Math.floor(x.week/48)}歳 / ${Math.floor(x.week%48/4)+1}月 第${x.week%4+1}週</div>${esc(x.text)}</div>`).join('')}</section>`}
function render(){document.getElementById('app').innerHTML=!state?newScreen():header()+nav()+({home,train,stats,pitch:pitches,talent,history}[tab]||home)()}
function multiplier(stat){let m=1,t=state.talents;if(t.includes(6))m*=1.5;if(t.includes(0)&&['パワー','走力','スタミナ','守備力','肩力'].includes(stat))m*=1.5;if(t.includes(1)&&['ミート','パワー'].includes(stat))m*=2;if(t.includes(2)&&['球速','コントロール'].includes(stat))m*=2;if(t.includes(3)&&['守備力','肩力'].includes(stat))m*=2;if(t.includes(4)&&['ミート','野球センス'].includes(stat))m*=2;if(t.includes(5)&&['変化球総合','コントロール'].includes(stat))m*=2;if(t.includes(11)&&stat==='野球センス')m*=2;if(t.includes(15)&&stat==='走力')m*=1.5;if(t.includes(16)&&stat==='パワー')m*=1.5;if(t.includes(17)&&stat==='スタミナ')m*=1.5;if(t.includes(26)&&(month()===12||month()<=2))m*=2;if(t.includes(9)&&state.motivation>=80&&Math.random()<(state.motivation===100?.6:.4))m*=2;if(t.includes(10)&&stat==='野球センス'&&Math.random()<.125)m*=2;if(t.includes(13)&&stat==='野球センス'&&Math.random()<.125)m*=2;return m}
function gain(stat,n=1,useTalent=true){let before=state.stats[stat];let v=n*(useTalent?multiplier(stat):1);state.stats[stat]=clamp(before+v,0,1000);return state.stats[stat]-before}
function injuryChance(){let s=state.stamina;let p=s>=80?.01:s>=60?.02:s>=40?.05:s>=20?.10:.20;return state.talents.includes(8)?p/2:p}
function train(i){if(!state||state.finished||state.injury||age()<ACTIONS[i][1])return;let a=ACTIONS[i];if(i===9){state.stamina=clamp(state.stamina+10,0,100);state.motivation=clamp(state.motivation+5,0,100);addLog('練習をしたフリ。体力+10、やる気+5。');advance();return}let old=state.stats['変化球総合'],p=injuryChance(),weak=state.motivation<20?.5:1,details=[];for(let s of a[2]){let delta=gain(s,weak);details.push(s+'+'+(Math.round(delta*100)/100))}state.stamina=clamp(state.stamina-10,0,100);state.motivation=clamp(state.motivation-5,0,100);addLog(a[0]+'：'+details.join('、'));if(Math.random()<p){state.injury=1+rand(12);if(Math.random()<.12)state.injury=13+rand(36);if(Math.random()<.02)state.injury=49+rand(48);state.injuryName=['捻挫','筋肉の損傷','疲労による故障','打撲'][rand(4)];addLog('ケガ発生：'+state.injuryName+'（'+state.injury+'週間）')}let unlock=[];if(i===7){for(let t=100;t<=700;t+=100)if(old<t&&state.stats['変化球総合']>=t&&state.pitches.length+unlock.length<7)unlock.push(t)}let grow=i===7&&state.pitches.some(x=>x.move<7)&&Math.random()<.05;advance(unlock,grow)}
function advance(unlock=[],grow=false){state.week++;if(state.injury>0){state.injury--;if(state.injury===0){addLog('ケガが回復した！');state.injuryName=''}}if(state.week>=864){state.finished=true;addLog('18年間の育成が終了！ プロ志望届・ドラフトは今後実装予定。')}save();render();if(unlock.length){pending={type:'unlock',left:unlock,grow};showPending()}else if(grow){pending={type:'grow'};showPending()}}
function rest(){if(state.finished)return;state.stamina=clamp(state.stamina+50,0,100);state.motivation=clamp(state.motivation+20,0,100);addLog('休養：体力+50、やる気+20');advance()}
function study(){if(state.finished)return;gain('学力');gain('野球センス');state.stamina=clamp(state.stamina-5,0,100);state.motivation=clamp(state.motivation-5,0,100);addLog('勉強：学力+1、野球センス+1');advance()}
function skip(){if(state.finished)return;addLog('何もせずに1週間を過ごした。');advance()}
function fastForward(){if(age()>=3||state.finished)return;state.week=144;addLog('3歳になった！ 練習ができるようになった。');save();render()}
function showPending(){if(!pending)return;if(pending.type==='unlock'){let t=pending.left[0];modal(`<h2>✨ 新しい変化球を習得！</h2><p class="muted">変化球総合が${t}に到達！ 好きな球種を1つ選んでね。初期変化量は1〜3のランダム。</p><div class="pitchgrid">${PITCHES.map((name,i)=>`<button class="pitchbtn" ${state.pitches.some(p=>p.name===name)?'disabled':''} onclick="choosePitch(${i})">${esc(name)}</button>`).join('')}</div>`)}else if(pending.type==='grow'){modal(`<h2>🎉 変化量が成長！</h2><p class="muted">5％の成長判定に成功！ 変化量を＋1する球種を選んでね。</p><div class="pitchgrid">${state.pitches.map((p,i)=>`<button class="pitchbtn" ${p.move>=7?'disabled':''} onclick="growPitch(${i})">${esc(p.name)}<br>変化量 ${p.move} → ${Math.min(7,p.move+1)}</button>`).join('')}</div>`)} }
function choosePitch(i){if(!pending||pending.type!=='unlock')return;let name=PITCHES[i];if(state.pitches.some(p=>p.name===name))return;let move=1+rand(3);state.pitches.push({name,move});addLog('新球種「'+name+'」を習得！（初期変化量'+move+'）');pending.left.shift();if(pending.left.length){save();render();showPending();return}let grow=pending.grow;pending=grow?{type:'grow'}:null;save();render();if(pending)showPending();else document.getElementById('modal').classList.add('hide')}
function growPitch(i){if(!pending||pending.type!=='grow')return;let p=state.pitches[i];if(!p||p.move>=7)return;p.move++;addLog(p.name+'の変化量が'+p.move+'になった！');pending=null;save();document.getElementById('modal').classList.add('hide');render();notice('変化量が＋1！')}
function resetGame(){if(!confirm('現在の育成データを削除して、最初からやり直しますか？'))return;localStorage.removeItem(KEY);state=null;pending=null;tab='home';render()}
function exportSave(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='baseball-life-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
load();render();
</script></body></html>
